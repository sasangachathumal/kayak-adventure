name: PR preview

on:
  pull_request:
    branches: [prod]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write     # needed to post the comment

jobs:
  preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Debug gallery files
        run: |
          echo "cwd: $(pwd)"
          ls -la public/gallery-images | head -5
          ls public/gallery-images | wc -l

      - name: Generate gallery manifest
        run: npm run prebuild

      - name: Build
        run: npx opennextjs-cloudflare build

      # Branch names can contain characters not allowed in a URL,
      # so clean it into a safe short alias.
      - name: Make a safe alias
        id: alias
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          SAFE=$(echo "$BRANCH" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9-]/-/g' \
            | cut -c1-25 \
            | sed 's/-*$//')
          echo "name=$SAFE" >> "$GITHUB_OUTPUT"

      - name: Upload preview version
        id: upload
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias ${{ steps.alias.outputs.name }}

      - name: Comment the preview link on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const alias = '${{ steps.alias.outputs.name }}';
            const body = `🚀 **Preview ready**\n\nAlias: \`${alias}\`\n\nThe exact URL is printed in the *Upload preview version* step of this run. It follows the pattern:\n\`https://${alias}-kayak-adventure.sasanga-dev.workers.dev\``;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });