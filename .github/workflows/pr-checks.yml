name: PR checks

on:
  pull_request:
    branches: [prod]

# If you push again to the same PR, cancel the older run
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Generate gallery manifest
        run: npm run prebuild

      - name: Build
        run: npx opennextjs-cloudflare build